<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="470" viewBox="0 0 1300 470">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/>
    </marker>
    <marker id="arrowDim" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#b96518"/>
    </marker>
  </defs>
  <rect width="1300" height="470" fill="#fffdf8"/>
  <text x="36" y="40" font-family="JetBrains Maple Mono, monospace" font-size="14" letter-spacing="2" fill="#b96518">TRAINING PIPELINE</text>
  <text x="36" y="72" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#20211f">一步训练里真正发生的事</text>

  <g font-family="JetBrains Maple Mono, monospace" font-size="12.5" fill="#20211f">
    <rect x="36" y="110" width="160" height="74" rx="10" fill="#fbf7ee" stroke="#d2c6b4"/>
    <text x="52" y="140">DataLoader</text><text x="52" y="162" fill="#6b6459">x0, batch</text>

    <rect x="230" y="110" width="180" height="74" rx="10" fill="#fbf7ee" stroke="#d2c6b4"/>
    <text x="246" y="140">sample t, ε</text><text x="246" y="162" fill="#6b6459">t~U, ε~N(0,I)</text>

    <rect x="444" y="110" width="200" height="74" rx="10" fill="#fbf7ee" stroke="#d2c6b4"/>
    <text x="460" y="140">x_t = √ᾱ_t x0 + ...</text><text x="460" y="162" fill="#6b6459">closed form</text>

    <rect x="678" y="110" width="170" height="74" rx="10" fill="#e9f3f1" stroke="#0f766e"/>
    <text x="694" y="140">U-Net(x_t, t)</text><text x="694" y="162" fill="#0a5c56">predict εθ</text>

    <rect x="882" y="110" width="160" height="74" rx="10" fill="#fbf7ee" stroke="#d2c6b4"/>
    <text x="898" y="140">L_simple</text><text x="898" y="162" fill="#6b6459">Huber / MSE</text>

    <rect x="1076" y="110" width="188" height="74" rx="10" fill="#fbf7ee" stroke="#d2c6b4"/>
    <text x="1092" y="140">backward + step</text><text x="1092" y="162" fill="#6b6459">AdamW · clip</text>
  </g>

  <g stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)">
    <line x1="196" y1="147" x2="226" y2="147"/>
    <line x1="410" y1="147" x2="440" y2="147"/>
    <line x1="644" y1="147" x2="674" y2="147"/>
    <line x1="848" y1="147" x2="878" y2="147"/>
    <line x1="1042" y1="147" x2="1072" y2="147"/>
  </g>

  <g font-family="JetBrains Maple Mono, monospace" font-size="12.5">
    <rect x="36" y="250" width="230" height="64" rx="10" fill="#fbf7ee" stroke="#d2c6b4"/>
    <text x="52" y="278" fill="#20211f">EMA.update(model)</text><text x="52" y="298" fill="#6b6459">shadow weights</text>

    <rect x="300" y="250" width="220" height="64" rx="10" fill="#fbf7ee" stroke="#d2c6b4"/>
    <text x="316" y="278" fill="#20211f">save last.pt</text><text x="316" y="298" fill="#6b6459">model · ema · opt</text>

    <rect x="554" y="250" width="230" height="64" rx="10" fill="#fbf7ee" stroke="#d2c6b4"/>
    <text x="570" y="278" fill="#20211f">metrics.jsonl</text><text x="570" y="298" fill="#6b6459">step · loss · elapsed</text>

    <rect x="818" y="250" width="220" height="64" rx="10" fill="#fbf7ee" stroke="#d2c6b4"/>
    <text x="834" y="278" fill="#20211f">sample preview</text><text x="834" y="298" fill="#6b6459">DDIM 50 steps</text>
  </g>
  <text x="36" y="336" font-family="JetBrains Maple Mono, monospace" font-size="11" fill="#b96518">per step: optimizer.step() → ema.update() → log/save/sample on schedule</text>

  <line x1="36" y1="348" x2="1264" y2="348" stroke="#e1d9cb"/>
  <text x="36" y="388" font-family="JetBrains Maple Mono, monospace" font-size="14" letter-spacing="2" fill="#b96518">SAMPLING PIPELINE</text>
  <g font-family="JetBrains Maple Mono, monospace" font-size="12.5" fill="#20211f">
    <rect x="36" y="404" width="180" height="44" rx="9" fill="#fbf7ee" stroke="#d2c6b4"/>
    <text x="52" y="431">x_T ~ N(0, I)</text>
    <rect x="250" y="404" width="360" height="44" rx="9" fill="#e9f3f1" stroke="#0f766e"/>
    <text x="266" y="431" fill="#0a5c56">for t = T...1: predict ε, step</text>
    <rect x="644" y="404" width="220" height="44" rx="9" fill="#fbf7ee" stroke="#d2c6b4"/>
    <text x="660" y="431">x0 (DDPM / DDIM)</text>
    <rect x="898" y="404" width="170" height="44" rx="9" fill="#fbf7ee" stroke="#d2c6b4"/>
    <text x="914" y="431">save image grid</text>
  </g>
  <g stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)">
    <line x1="216" y1="426" x2="246" y2="426"/>
    <line x1="610" y1="426" x2="640" y2="426"/>
    <line x1="864" y1="426" x2="894" y2="426"/>
  </g>
</svg>
