[project]
name = "ddpm"
version = "0.1.0"
description = "CPU-friendly DDPM: modular U-Net, diffusion, training and sampling"
readme = "README.md"
authors = [
    { name = "Zebraine", email = "zebrainee@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "datasets>=5.1.0",
    "einops>=0.8.2",
    "matplotlib>=3.11.2",
    "requests>=2.34.2",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "tqdm>=4.70.1",
]

[project.scripts]
ddpm = "ddpm.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu" },
]
torchvision = [
  { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
